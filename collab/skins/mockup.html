<title>輕盈計畫換裝提案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Huninn&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Oswald:wght@500;700&family=Fraunces:opsz,wght@9..144,700&family=Abril+Fatface&display=swap">
<style>
/* Layout: 頁首說明 + 五支手機並排（窄螢幕單欄），每支下方是說明卡 */
:root{
  --bg:#F6F4F0; --fg:#26221E; --muted:#6F675E; --line:#E2DDD5; --panel:#FFFFFF; --frame:#1E1C1A; --accent:#B4542A;
  --ui:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1A1816;--fg:#EEE8E0;--muted:#A89F94;--line:#36312C;--panel:#24211E;--frame:#000;--accent:#E28A5C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1816;--fg:#EEE8E0;--muted:#A89F94;--line:#36312C;--panel:#24211E;--frame:#000;--accent:#E28A5C;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{max-width:68ch;display:grid;gap:8px;margin-bottom:28px}
.intro h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:900;text-wrap:balance}
.intro p{margin:0;color:var(--muted)}
.intro strong{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:36px 28px;align-items:start}
.opt{display:grid;gap:14px;justify-items:center;min-width:0}
.note{width:min(100%,340px);display:grid;gap:6px}
.note h2{margin:0;font-size:18px;display:flex;align-items:baseline;gap:8px}
.note h2 span{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.note p{margin:0;font-size:13.5px;color:var(--muted)}
.note dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.note dt{color:var(--muted);white-space:nowrap}
.note dd{margin:0}
.lvl{display:inline-block;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.foot{margin-top:40px;max-width:68ch;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px;color:var(--muted)}
.foot h2{margin:0;font-size:16px;color:var(--fg)}

/* ---------- 手機外框與共用骨架 ---------- */
.phone{width:min(100%,340px);border:8px solid var(--frame);border-radius:36px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.scr{font-size:13px;line-height:1.55;padding-bottom:20px;min-height:640px;position:relative;overflow:hidden}
.ah{position:relative;padding:18px 16px 10px;text-align:center}
.ah h1{margin:0;font-size:20px;position:relative}
.tabs{display:flex;gap:6px;padding:8px 12px;overflow:hidden}
.tab{white-space:nowrap;padding:4px 11px;font-size:12px;flex:none}
.hero{position:relative;margin:12px 12px 0;padding:16px}
.hl{font-size:12px}
.hk{display:flex;align-items:baseline;gap:4px}
.hk b{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.hk small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sl{font-size:11px}
.sv{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--p)}
.card{position:relative;margin:16px 12px 0;padding:14px}
.card h3{margin:0 0 6px;font-size:16px;position:relative}
.dish{margin:0;font-weight:700;font-size:14px}
.meta{margin:4px 0 0;font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:#3DAA4F}.dot.y{background:#F0C419}
.parts{margin:4px 0 0;font-size:11.5px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.b{display:block;text-align:center;padding:7px 0;font-size:13px}
.stamp{position:absolute;z-index:2}
.deco{position:absolute;pointer-events:none}

/* ---------- 1 手帳溫馨 ---------- */
.t-jr .scr{background:#FFFCF4;color:#4A3B2C;font-family:"LXGW WenKai TC",var(--ui);
  background-image:linear-gradient(rgba(170,140,100,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(170,140,100,.13) 1px,transparent 1px);background-size:18px 18px}
.t-jr .ah h1{display:inline;font-size:23px;font-weight:700;background:linear-gradient(transparent 58%,#F7D58B 58%,#F7D58B 92%,transparent 92%);padding:0 4px}
.t-jr .sprig{width:30px;height:30px;right:58px;top:10px}
.t-jr .tabs{border-bottom:1.5px solid #4A3B2C;padding-bottom:0;gap:3px}
.t-jr .tab{border:1.5px solid #4A3B2C;border-bottom:0;border-radius:9px 9px 0 0;background:#fff;color:#7A6853}
.t-jr .tab:nth-child(1){background:#E3EDD8}.t-jr .tab:nth-child(3){background:#FBE7C6}.t-jr .tab:nth-child(4){background:#E4E0F2}.t-jr .tab:nth-child(5){background:#F9DCD6}
.t-jr .tab.on{background:#F4C7A9;color:#4A3B2C;font-weight:700;padding-top:7px;margin-top:-3px}
.t-jr .hero,.t-jr .card{background:#fff;border:1.5px solid #4A3B2C;border-radius:3px;box-shadow:3px 3px 0 #EADBC4}
.t-jr .hero{transform:rotate(-.6deg);margin-top:20px}
.t-jr .tape{position:absolute;top:-10px;left:50%;width:84px;height:20px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(232,150,120,.7) 0 6px,rgba(246,196,172,.7) 6px 12px)}
.t-jr .card .tape{left:auto;right:-12px;width:64px;transform:rotate(36deg);background:repeating-linear-gradient(90deg,rgba(150,185,140,.7) 0 5px,rgba(200,220,190,.7) 5px 10px)}
.t-jr .hk b{font-size:46px;color:#C9643F;font-weight:700}
.t-jr .bar{height:9px;border:1.5px solid #4A3B2C;border-radius:6px;background:#fff}
.t-jr .bar i{background:repeating-linear-gradient(-45deg,#8FAE7B 0 3px,#C3D6B3 3px 6px)}
.t-jr .card:nth-of-type(odd){transform:rotate(.5deg)}
.t-jr .card h3{font-weight:700;font-size:18px}
.t-jr .parts,.t-jr .meta,.t-jr .hl,.t-jr .sl{color:#8A7760}
.t-jr .b{border:1.5px solid #4A3B2C;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:#fff;color:#4A3B2C}
.t-jr .b.p{background:#F9E0CF}
.t-jr .stamp{right:14px;top:8px;width:58px;height:58px;border:2px solid #C8553D;color:#C8553D;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;transform:rotate(14deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px #C8553D;opacity:.85}

/* ---------- 2 運動活力 ---------- */
.t-sp .scr{background:#EEF1EC;color:#10202B;font-family:var(--ui)}
.t-sp .ah{background:#12263A;color:#fff;text-align:left;padding:20px 16px 34px;clip-path:polygon(0 0,100% 0,100% 74%,0 100%);
  background-image:repeating-linear-gradient(115deg,transparent 0 22px,rgba(200,242,58,.09) 22px 27px)}
.t-sp .ah h1{font-weight:900;font-style:italic;font-size:24px;letter-spacing:.02em}
.t-sp .kick{display:block;font-family:Oswald,var(--ui);font-size:12px;letter-spacing:.14em;color:#C8F23A}
.t-sp .tabs{margin-top:-12px;position:relative}
.t-sp .tab{transform:skewX(-12deg);background:#fff;font-weight:700;color:#6B7A86;border-radius:3px}
.t-sp .tab.on{background:#C8F23A;color:#10202B}
.t-sp .hero,.t-sp .card{background:#fff;border-radius:14px}
.t-sp .hl{font-weight:700;letter-spacing:.06em;color:#6B7A86}
.t-sp .hk b{font-family:Oswald,var(--ui);font-weight:700;font-size:54px;color:#12263A}
.t-sp .hk small{font-family:Oswald,var(--ui);font-weight:500;color:#6B7A86}
.t-sp .ring{right:14px;top:14px;width:86px;height:86px;border-radius:50%;background:conic-gradient(#FF5B3A 0 23%,#E4E9E1 0);display:grid;place-items:center}
.t-sp .ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}
.t-sp .ring span{position:relative;text-align:center;font-family:Oswald,var(--ui);font-weight:700;font-size:20px;line-height:1}
.t-sp .ring small{display:block;font-family:var(--ui);font-size:10px;font-weight:500;color:#6B7A86;margin-top:2px}
.t-sp .sl{color:#6B7A86;font-weight:700}
.t-sp .sv{font-family:Oswald,var(--ui);font-size:15px}
.t-sp .bar{height:8px;background:#E4E9E1;border-radius:4px}
.t-sp .bar i{background:#12263A;border-radius:4px}
.t-sp .st:nth-child(2) .bar i{background:#FF5B3A}
.t-sp .streak{margin:12px 12px 0;padding:10px 14px;background:#12263A;color:#fff;border-radius:14px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px}
.t-sp .streak em{font-style:normal;margin-right:auto}
.t-sp .streak i{width:14px;height:22px;border-radius:3px;background:rgba(255,255,255,.15);transform:skewX(-12deg)}
.t-sp .streak i.on{background:#C8F23A}
.t-sp .streak b{font-family:Oswald,var(--ui);font-size:16px;margin-left:6px;color:#C8F23A}
.t-sp .card h3{display:inline-block;background:#12263A;color:#fff;padding:2px 10px;transform:skewX(-12deg);font-size:13px;letter-spacing:.06em}
.t-sp .card h3::after{content:attr(data-en);font-family:Oswald,var(--ui);color:#C8F23A;margin-left:6px;font-size:11px;letter-spacing:.14em}
.t-sp .meta,.t-sp .parts{color:#5A6873}
.t-sp .b{border-radius:999px;font-weight:700}
.t-sp .b.p{background:#12263A;color:#fff}
.t-sp .b.n{background:#EEF1EC;color:#45535E}
.t-sp .stamp{right:12px;top:14px;background:#C8F23A;font-weight:900;font-size:11px;padding:3px 9px;transform:skewX(-12deg);letter-spacing:.08em}

/* ---------- 3 菜市場清新 ---------- */
.t-mk .scr{background:#F4F7EC;color:#23361F;font-family:var(--ui)}
.t-mk .ah{padding:0 0 10px}
.t-mk .awning{height:30px;background:repeating-linear-gradient(90deg,#3E8A4A 0 26px,#FFFDF5 26px 52px);position:relative}
.t-mk .awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:13px;
  background:radial-gradient(circle at 13px 0,#3E8A4A 12.5px,transparent 13px) 0 0/52px 13px repeat-x,radial-gradient(circle at 39px 0,#FFFDF5 12.5px,transparent 13px) 0 0/52px 13px repeat-x}
.t-mk .ah h1{display:inline-block;margin-top:22px;background:#E9D3AE;border:2px solid #8A6A3E;border-radius:6px;padding:2px 18px;font-weight:900;color:#5A3F1E;letter-spacing:.1em}
.t-mk .tab{border-radius:999px;background:#fff;border:1.5px solid #CFE0C4;color:#3E8A4A;font-weight:700}
.t-mk .tab.on{background:#3E8A4A;border-color:#3E8A4A;color:#fff}
.t-mk .hero{background:#2F3D33;color:#F3EFE2;border:7px solid #9A7146;border-radius:6px;font-family:"LXGW WenKai TC",var(--ui);
  box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.t-mk .hl{color:#C9D3C4}
.t-mk .hk b{font-family:Fraunces,serif;font-size:46px;color:#FFE7A8}
.t-mk .sl{color:#C9D3C4}
.t-mk .bar{height:6px;background:rgba(255,255,255,.14);border-radius:3px}
.t-mk .bar i{background:#F2A23A;border-radius:3px}
.t-mk .st:nth-child(2) .bar i{background:#9CD08C}
.t-mk .card{background:#FFFDF5;border-radius:14px;border:1.5px solid #DCE7D1;padding-top:18px}
.t-mk .card h3{display:inline-block;background:#E9D3AE;color:#5A3F1E;padding:1px 14px 1px 22px;font-size:14px;margin-left:-4px;
  clip-path:polygon(11px 0,100% 0,100% 100%,11px 100%,0 50%)}
.t-mk .card h3::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FFFDF5}
.t-mk .veg{right:10px;top:-16px;width:44px;height:44px}
.t-mk .meta,.t-mk .parts{color:#5B6E55}
.t-mk .b{border-radius:10px;font-weight:700}
.t-mk .b.p{background:#E0533A;color:#fff}
.t-mk .b.n{background:#fff;border:1.5px solid #CFE0C4;color:#3E5A3A}
.t-mk .stamp{right:12px;top:12px;background:#F2A23A;color:#fff;font-weight:900;font-size:11px;padding:6px 10px;border-radius:50%;border:2px dashed #fff;box-shadow:0 0 0 2px #F2A23A;transform:rotate(-10deg)}

/* ---------- 4 台式復古食堂 ---------- */
.t-rt .scr{background:#F5ECD7;color:#2A2421;font-family:"Noto Serif TC",serif}
.t-rt .ah{padding:16px 16px 14px;background:
  repeating-linear-gradient(0deg,rgba(183,48,42,.5) 0 9px,transparent 9px 18px),
  repeating-linear-gradient(90deg,rgba(183,48,42,.5) 0 9px,transparent 9px 18px),#FFF8E8}
.t-rt .ah h1{display:inline-block;background:#FFF8E8;color:#B7302A;font-weight:900;font-size:22px;letter-spacing:.24em;padding:4px 14px 4px 20px;border:4px double #B7302A;border-radius:6px}
.t-rt .seal{right:22px;top:12px;width:34px;height:40px;background:#B7302A;color:#FFF8E8;font-size:13px;line-height:1.15;font-weight:900;display:grid;place-items:center;text-align:center;border-radius:3px;transform:rotate(6deg);padding:2px}
.t-rt .tabs{background:#2F5D50;padding:7px 10px}
.t-rt .tab{color:#E9DFC6;font-weight:700;border-radius:3px}
.t-rt .tab.on{background:#B7302A;color:#FFF8E8}
.t-rt .hero{background:#FFF8E8;border:2px solid #2A2421;box-shadow:0 0 0 4px #F5ECD7,0 0 0 5px #2A2421;margin-top:18px;text-align:center}
.t-rt .hl{font-weight:700;letter-spacing:.2em;color:#6E5E4E}
.t-rt .hl::before,.t-rt .hl::after{content:"◆";color:#B7302A;font-size:9px;margin:0 8px;vertical-align:middle}
.t-rt .hk{justify-content:center}
.t-rt .hk b{font-family:"Abril Fatface",serif;font-weight:400;font-size:50px;color:#B7302A}
.t-rt .stats{grid-template-columns:1fr;gap:2px;text-align:left}
.t-rt .st{display:flex;align-items:baseline;gap:6px}
.t-rt .st::after{content:"";order:2;flex:1;border-bottom:2px dotted #A89580}
.t-rt .sl{order:1;font-size:13px;font-weight:700}
.t-rt .sv{order:3}
.t-rt .bar{display:none}
.t-rt .card{background:#FFFDF6;border-radius:20px;border:5px solid #2C5B8C;box-shadow:inset 0 0 0 3px #FFFDF6,inset 0 0 0 4px rgba(44,91,140,.35),0 3px 0 rgba(42,36,33,.15)}
.t-rt .card h3{display:inline-block;background:#B7302A;color:#FFF8E8;padding:1px 12px;font-size:14px;letter-spacing:.3em;border-radius:2px}
.t-rt .meta,.t-rt .parts{color:#6E5E4E;font-family:var(--ui)}
.t-rt .b{border-radius:4px;font-weight:700}
.t-rt .b.p{background:#2F5D50;color:#FFF8E8}
.t-rt .b.n{border:1.5px solid #2A2421;color:#2A2421}
.t-rt .stamp{right:16px;top:12px;border:2.5px solid #B7302A;color:#B7302A;font-weight:900;font-size:12px;padding:3px 6px;border-radius:4px;transform:rotate(-8deg);opacity:.85;letter-spacing:.1em}

/* ---------- 5 療癒粉彩 ---------- */
.t-ps .scr{background:#FFF5EF;color:#4A3F5C;font-family:Huninn,var(--ui);
  background-image:radial-gradient(circle at 92% 6%,#FFE3D6 0 70px,transparent 71px),radial-gradient(circle at 4% 34%,#E7F6EE 0 60px,transparent 61px),radial-gradient(circle at 96% 70%,#EDE5FB 0 70px,transparent 71px)}
.t-ps .ah h1{font-size:22px;color:#4A3F5C}
.t-ps .ah h1::after{content:"";display:block;width:46px;height:6px;margin:4px auto 0;border-radius:3px;background:repeating-linear-gradient(90deg,#FFB59E 0 10px,#9FDCC2 10px 20px,#CBB8F2 20px 30px)}
.t-ps .tab{background:#fff;border-radius:999px;box-shadow:0 2px 0 #EAD9E9;color:#8A7C9C}
.t-ps .tab.on{background:#CBB8F2;color:#3D2F55;box-shadow:0 2px 0 #A995D8}
.t-ps .hero,.t-ps .card{background:#fff;border-radius:26px;box-shadow:0 4px 0 #F2DCD3}
.t-ps .hero{padding-right:96px}
.t-ps .mascot{right:10px;top:22px;width:74px;height:70px}
.t-ps .bubble{right:14px;top:-12px;background:#FFE39A;font-size:11px;padding:2px 9px;border-radius:12px 12px 2px 12px;color:#5A4520}
.t-ps .hl,.t-ps .sl{color:#8A7C9C}
.t-ps .hk b{color:#F08A6C;font-size:44px}
.t-ps .stats{grid-template-columns:repeat(2,1fr)}
.t-ps .st:nth-child(3){grid-column:1/-1;display:flex;gap:8px;align-items:baseline}
.t-ps .bar{height:10px;border-radius:5px;background:#F4ECF7}
.t-ps .bar i{background:#9FDCC2;border-radius:5px}
.t-ps .st:nth-child(2) .bar i{background:#FFD36E}
.t-ps .card h3{display:flex;align-items:center;gap:8px}
.t-ps .card h3::before{content:"";width:14px;height:14px;border-radius:50% 50% 50% 20%;background:#FFB59E}
.t-ps .card.done h3::before{background:#9FDCC2}
.t-ps .meta,.t-ps .parts{color:#7D7090}
.t-ps .b{border-radius:14px;box-shadow:0 3px 0 rgba(74,63,92,.14)}
.t-ps .b.p{background:#FFB59E;color:#4A2E25}
.t-ps .b.n{background:#F1ECF8;color:#6E6283}
.t-ps .stamp{right:16px;top:12px;background:#9FDCC2;color:#24533F;font-size:12px;padding:4px 10px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.08);transform:rotate(-6deg)}

/* ---------- 6 晚安小廚房（深色） ---------- */
.t-nt .scr{background:#1E1B2E;color:#EDE4D3;font-family:"Noto Serif TC",serif;
  background-image:radial-gradient(1.2px 1.2px at 30px 40px,#fff8 50%,transparent),radial-gradient(1px 1px at 120px 18px,#fff6 50%,transparent),radial-gradient(1.4px 1.4px at 260px 54px,#fff9 50%,transparent),radial-gradient(1px 1px at 200px 90px,#fff5 50%,transparent),radial-gradient(1px 1px at 300px 120px,#fff6 50%,transparent)}
.t-nt .ah h1{color:#F6D9A8;font-weight:700;letter-spacing:.12em}
.t-nt .moon{right:30px;top:14px;width:22px;height:22px;border-radius:50%;box-shadow:-6px 3px 0 0 #F6D9A8}
.t-nt .tab{border-radius:999px;color:#A99FBE;border:1px solid #3A3452;font-family:var(--ui)}
.t-nt .tab.on{background:#F6D9A8;color:#2A2238;border-color:#F6D9A8;font-weight:700}
.t-nt .hero{background:radial-gradient(120% 90% at 50% 0%,rgba(246,200,130,.28),transparent 62%),#2A2640;border-radius:20px;border:1px solid #3E3858;text-align:center}
.t-nt .hk{justify-content:center}
.t-nt .hl,.t-nt .sl{color:#B6ACCB;font-family:var(--ui)}
.t-nt .hk b{color:#FFD796;font-size:46px;text-shadow:0 0 18px rgba(255,200,120,.45)}
.t-nt .bar{height:4px;background:#3E3858;border-radius:2px}
.t-nt .bar i{background:#FFD796;border-radius:2px;box-shadow:0 0 8px #FFD796}
.t-nt .card{background:#2A2640;border-radius:18px;border:1px solid #3E3858}
.t-nt .card h3{color:#F6D9A8}
.t-nt .meta,.t-nt .parts{color:#B6ACCB;font-family:var(--ui)}
.t-nt .dish{font-family:var(--ui)}
.t-nt .b{border-radius:12px;font-family:var(--ui)}
.t-nt .b.p{background:#F6D9A8;color:#2A2238;font-weight:700}
.t-nt .b.n{border:1px solid #4A4366;color:#CFC6E0}
.t-nt .stamp{right:14px;top:14px;color:#9FE0B8;font-size:12px;font-family:var(--ui);border:1px solid #9FE0B8;padding:1px 8px;border-radius:999px}
</style>

<div class="wrap">
  <header class="intro">
    <h1>輕盈計畫換裝提案</h1>
    <p>六種裝飾方向，都套在同一個「今日建議」畫面上：剩餘熱量、已記錄的早餐、還沒吃的晚餐。內容一樣，只換外觀，方便直接比較。</p>
    <p><strong>現況</strong>是米白底、焦橙按鈕、標題襯線字，加上晚餐卡的水彩插圖。每個方向下面寫了它靠什麼元素撐起來、改起來要動多少。</p>
  </header>
  <main class="grid" id="grid"></main>
  <section class="foot">
    <h2>不管選哪個，第一步都一樣</h2>
    <p>現在 css/style.css 的顏色是一個一個寫死的（例如按鈕的 #C1652F、底色 #FBF5ED）。先把顏色、圓角、字體抽成 CSS 變數，之後換風格只改一組變數；也能做成「設定裡切換主題」，讓使用者自己挑。</p>
    <p>裝飾元素（膠帶、遮陽棚、飯糰角色等）全部是 CSS 或小段 SVG，不用另外載入圖片檔。</p>
  </section>
</div>

<script>
const leaf='<svg class="deco sprig" viewBox="0 0 30 30" fill="none" stroke="#7E9B6A" stroke-width="1.6" stroke-linecap="round"><path d="M4 27C10 18 17 12 27 7"/><path d="M11 20C8 15 10 10 15 9"/><path d="M17 15C19 11 23 10 27 12"/><path d="M8 23C5 22 3 19 4 16"/></svg>';
const tomato='<svg class="deco veg" viewBox="0 0 40 40"><circle cx="20" cy="24" r="13" fill="#E0533A"/><circle cx="15" cy="20" r="3" fill="#fff" opacity=".35"/><path d="M20 9l3 5 5-2-3 5 4 3H11l4-3-3-5 5 2z" fill="#3E8A4A"/></svg>';
const riceball='<svg class="deco mascot" viewBox="0 0 60 56"><path d="M30 4C36 4 57 40 54 47C52 53 8 53 6 47C3 40 24 4 30 4Z" fill="#fff" stroke="#4A3F5C" stroke-width="2.5" stroke-linejoin="round"/><rect x="21" y="38" width="18" height="14" rx="2" fill="#3B3548"/><circle cx="24" cy="28" r="2.2" fill="#4A3F5C"/><circle cx="36" cy="28" r="2.2" fill="#4A3F5C"/><ellipse cx="19.5" cy="33" rx="3" ry="1.8" fill="#FFB59E"/><ellipse cx="40.5" cy="33" rx="3" ry="1.8" fill="#FFB59E"/><path d="M27 32Q30 35 33 32" fill="none" stroke="#4A3F5C" stroke-width="1.8" stroke-linecap="round"/></svg>';

const themes=[
 {id:'jr',name:'手帳溫馨',en:'Journal',mood:'像自己寫的飲食手帳：方格紙、紙膠帶、螢光筆、紅色「吃了！」印章。最接近現在的暖色調，也跟水彩插圖最搭。',
  els:'方格紙底、紙膠帶、螢光筆標題、手繪框按鈕、圓形印章',cost:'低：只改 CSS，加一個小葉子 SVG',fit:'很搭（同樣是手作感）',
  header:leaf,hero:'<span class="tape"></span>',card:'<span class="tape"></span>',stamp:'吃了！'},
 {id:'sp',name:'運動活力',en:'Sport',mood:'把減重當成訓練計畫：斜切深藍頁首、螢光綠重點、圓環進度、本週達標格。跟「運動紀錄」分頁最一致。',
  els:'斜切頁首、斜體分頁、熱量圓環、7 天達標格、粗數字字體',cost:'中：CSS 加圓環與達標格兩個小元件',fit:'不太搭，水彩圖要換或拿掉',
  header:'<span class="kick">DAY 23 · 連續紀錄</span>',hero:'<div class="deco ring"><span>23%<small>已吃</small></span></div>',
  extra:'<div class="streak"><em>本週達標</em><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><b>4/7</b></div>',stamp:'已記錄'},
 {id:'mk',name:'菜市場清新',en:'Market',mood:'早市攤位：綠白條紋遮陽棚、木招牌、黑板寫今天還能吃多少、牛皮紙價格牌當餐別標籤。跟「找食材、自己煮」的主軸對得上。',
  els:'遮陽棚波浪邊、木頭框黑板、價格牌標籤、番茄小圖、水果貼紙',cost:'中：CSS 為主，加幾個蔬果 SVG',fit:'還可以，黑板區要避開插圖',
  header:'<div class="awning"></div>',card:tomato,stamp:'已記錄',awningFirst:true},
 {id:'rt',name:'台式復古食堂',en:'Retro diner',mood:'巷口自助餐、老便當店：紅白格子桌巾、雙線招牌、紅色印章、搪瓷盤邊框、菜單式點點引線。台味最重，最有辨識度。',
  els:'格子桌巾頁首、雙線招牌、方印章、搪瓷藍盤緣、菜單引線',cost:'中：CSS 為主，統計區要改排版',fit:'可以，但插圖改成復古版畫風會更好',
  header:'<span class="deco seal">輕<br>盈</span>',stamp:'已食'},
 {id:'ps',name:'療癒粉彩',en:'Pastel',mood:'軟萌、沒有壓力：粉彩圓點底、Q 彈按鈕、一個會講話的飯糰角色。適合想降低減重焦慮、讓人每天願意打開的方向。',
  els:'粉彩泡泡底、按壓感按鈕、飯糰吉祥物＋對話框、圓體字',cost:'中高：吉祥物要定稿，最好畫幾種表情',fit:'普通，水彩偏寫實，角色偏卡通',
  hero:riceball+'<span class="deco bubble">還能吃喔！</span>',stamp:'已記錄 ♡'},
 {id:'nt',name:'晚安小廚房',en:'Night',mood:'夜裡開一盞燈的廚房，延伸晚餐卡那張檯燈水彩：深紫夜空、點點星星、暖黃燈光在數字上發亮。可以當深色模式用。',
  els:'星空底、月亮、暖光暈數字、發光進度條',cost:'低到中：等於做一套深色主題',fit:'很搭（原本就有夜景插圖）',
  header:'<span class="deco moon"></span>',stamp:'已記錄'}
];

function phone(t){
  const head=t.awningFirst?`${t.header}<h1>輕盈計畫</h1>`:`${t.header||''}<h1>輕盈計畫</h1>`;
  return `<div class="phone t-${t.id}" role="img" aria-label="${t.name}風格的今日建議畫面"><div class="scr">
  <header class="ah">${head}</header>
  <nav class="tabs"><span class="tab">基本資料</span><span class="tab on">今日建議</span><span class="tab">我的食物</span><span class="tab">本週總覽</span><span class="tab">運動紀錄</span></nav>
  <section class="hero">${t.hero||''}
    <div class="hl">接下來幾餐的建議熱量</div>
    <div class="hk"><b>1,366</b><small>kcal</small></div>
    <div class="stats">
      <div class="st"><div class="sl">蛋白質</div><div class="sv">62 / 95g</div><div class="bar"><i style="--p:65%"></i></div></div>
      <div class="st"><div class="sl">纖維</div><div class="sv">14 / 25g</div><div class="bar"><i style="--p:56%"></i></div></div>
      <div class="st"><div class="sl">近7天平均</div><div class="sv">1,480 kcal</div></div>
    </div>
  </section>
  ${t.extra||''}
  <article class="card done">${t.card||''}<span class="stamp">${t.stamp}</span>
    <h3 data-en="BREAKFAST">早餐</h3>
    <p class="dish">早餐盤：地瓜＋水煮蛋＋無糖豆漿</p>
    <p class="meta"><i class="dot g"></i>已記錄 · 412 kcal</p>
  </article>
  <article class="card">${t.card||''}
    <h3 data-en="DINNER">晚餐</h3>
    <p class="dish">家常餐（白飯＋麻婆豆腐＋蒜蓉地瓜葉＋白菜燉雞湯）</p>
    <p class="meta"><i class="dot y"></i>約 671 kcal · 配額 671 kcal</p>
    <p class="parts">白飯 75g · 麻婆豆腐 240g · 蒜蓉地瓜葉 109g · 白菜燉雞湯 250g</p>
    <div class="btns"><span class="b p">紀錄</span><span class="b p">自選</span><span class="b n">不吃</span><span class="b n">換</span></div>
  </article>
</div></div>`;
}
document.getElementById('grid').innerHTML=themes.map((t,i)=>`<div class="opt">${phone(t)}
  <div class="note"><h2>${i+1}. ${t.name}<span>${t.en}</span></h2><p>${t.mood}</p>
  <dl><dt>裝飾元素</dt><dd>${t.els}</dd><dt>改動量</dt><dd><span class="lvl">${t.cost}</span></dd><dt>水彩插圖</dt><dd>${t.fit}</dd></dl></div></div>`).join('');
</script>
